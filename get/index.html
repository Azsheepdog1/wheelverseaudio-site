<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Get Dronewheel</title>
    <meta name="description" content="A whole music studio on one phone. Loops, drums, DJ decks and a mic looper." />
    <meta property="og:title" content="Get Dronewheel" />
    <meta property="og:description" content="A whole music studio on one phone." />
    <meta property="og:image" content="https://wheelverseaudio.com/get/icon.png" />
    <meta property="og:url" content="https://wheelverseaudio.com/get/" />
    <link rel="icon" href="/get/icon.png" />
    <script>
      // The one link in every bio. Phones go straight to their store; everything else sees the page.
      // When the Play listing is public, set PLAY_URL and Android phones redirect too.
      var APP_STORE_URL = 'https://apps.apple.com/app/id6784335792';
      var PLAY_URL = null;
      var ua = navigator.userAgent || '';
      var isIOS = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
      var isAndroid = /Android/.test(ua);
      if (isIOS) location.replace(APP_STORE_URL);
      else if (isAndroid && PLAY_URL) location.replace(PLAY_URL);
    </script>
    <style>
      :root {
        --bg: #e9ecf1;
        --ink: #23262d;
        --muted: #646a76;
        --hi: #ffffff;
        --lo: #c6cbd4;
        --btn: #23262d;
        --btn-ink: #f4f6f9;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #22252b;
          --ink: #eceef2;
          --muted: #9aa0ab;
          --hi: #2c3038;
          --lo: #181a1e;
          --btn: #eceef2;
          --btn-ink: #22252b;
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        padding: 24px 16px;
        background: var(--bg);
        color: var(--ink);
        font-family: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
        display: grid;
        place-items: center;
        text-align: center;
      }
      main { max-width: 360px; display: grid; gap: 20px; justify-items: center; }
      .icon {
        width: 112px; height: 112px; border-radius: 26px;
        box-shadow: 8px 8px 18px var(--lo), -8px -8px 18px var(--hi);
      }
      h1 { margin: 4px 0 0; font-size: 30px; font-weight: 600; letter-spacing: -0.01em; }
      p { margin: 0; color: var(--muted); font-size: 16px; line-height: 1.5; }
      .btn {
        display: inline-block; padding: 14px 26px; border-radius: 14px;
        background: var(--btn); color: var(--btn-ink);
        font-weight: 600; font-size: 16px; text-decoration: none;
      }
      .note { font-size: 14px; }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <main>
      <img class="icon" src="/get/icon.png" alt="Dronewheel app icon" width="112" height="112" />
      <h1>Dronewheel</h1>
      <p>A whole music studio on one phone. Loops, drums, DJ decks and a mic looper.</p>
      <a class="btn" id="store" href="https://apps.apple.com/app/id6784335792">Download on the App Store</a>
      <p class="note" id="note">For iPhone and iPad.</p>
    </main>
    <script>
      if (isAndroid && !PLAY_URL) {
        document.getElementById('note').textContent = 'Android is coming soon. For now, Dronewheel is on iPhone and iPad.';
      }
    </script>
  </body>
</html>
